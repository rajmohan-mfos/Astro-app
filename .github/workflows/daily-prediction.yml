name: Daily prediction to Telegram

# 02:45 UTC = 08:15 IST, Monday–Friday.
#
# Deliberately an hour before the 09:15 open rather than minutes before.
# GitHub's scheduled workflows are best-effort: they routinely start 5–20
# minutes late, and during peak load can be delayed much further or
# skipped altogether. An hour of slack means an ordinary delay still
# arrives in time. Do not tighten this to 09:00 IST expecting punctuality.
#
# NSE trading holidays are NOT handled — the job fires on any weekday,
# so you will get a message on holidays too.
#
# GitHub disables cron on repositories with no activity for 60 days; if
# the messages stop, push any commit or re-enable the workflow.

on:
  schedule:
    - cron: '45 2 * * 1-5'
  workflow_dispatch:        # lets you run it by hand to test
    inputs:
      date:
        description: 'today | tomorrow | +N | YYYY-MM-DD (blank = today)'
        required: false
        default: 'tomorrow'
      dry_run:
        description: 'Print the message instead of sending (1 = yes)'
        required: false
        default: '0'
      diagnose:
        description: 'Check token and list visible chat ids (1 = yes)'
        required: false
        default: '0'

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write      # to commit the published volatility forecast
    steps:
      # v7 for both: v4/v5 target Node 20, which GitHub deprecated and
      # already force-runs on Node 24. Pinned to the major tag so patch
      # releases arrive without another edit.
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'      # pyswisseph builds cleanly here

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install pyswisseph

      # The bot runs on a free host whose outbound access is restricted to
      # an allowlist that excludes every quote provider, so it cannot fetch
      # prices itself. This runner can, so it publishes the finished
      # forecast and the bot reads it back from GitHub (allowlisted).
      # Never fails the job: a missed refresh just leaves yesterday's
      # forecast in place, and the bot displays its age.
      - name: Publish volatility forecast for the bot
        continue-on-error: true
        working-directory: backend
        run: |
          python scripts/publish_forecast.py
          cd ..
          if ! git diff --quiet -- backend/app/volforecast.json; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add backend/app/volforecast.json
            git commit -m "Publish volatility forecast $(date -u +%Y-%m-%d)"
            git push
          else
            echo "forecast unchanged"
          fi

      - name: Send prediction
        working-directory: backend
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ASTRO_DATE: ${{ github.event.inputs.date }}
          ASTRO_DRY_RUN: ${{ github.event.inputs.dry_run }}
          ASTRO_DIAGNOSE: ${{ github.event.inputs.diagnose }}
        run: python scripts/daily_push.py
