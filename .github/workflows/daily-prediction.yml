name: Daily prediction to Telegram

# Target: the message in hand by 08:15 IST, Monday–Friday, before the
# 09:15 open.
#
# GitHub's scheduled workflows are best-effort. Measured on this repo in
# Aug 2026: the single 02:45 UTC slot fired 45–55 minutes late on a
# normal day, ten hours late on 27 Aug, and not at all on 28 Aug. So:
#
#   * THREE slots instead of one, at odd minutes (jobs queued on :00,
#     :15, :30, :45 are the ones that get starved). 07:53, 08:23 and
#     08:53 IST — whichever fires first sends; the others see the marker
#     and stop.
#   * A committed marker file (backend/app/last_push.txt) makes the
#     later slots idempotent: one message a day, never two.
#   * If every slot is delayed the message still arrives late rather
#     than never — the marker only blocks a SECOND send on the same day.
#
# NSE trading holidays: the job still fires, but daily_push.py consults
# backend/app/nse_holidays.py and sends nothing on a closed day (the
# marker is still stamped so the other slots stop). Add each new year's
# list there when NSE publishes it in December.
#
# GitHub disables cron on repositories with no activity for 60 days; the
# daily marker commit keeps it alive as a side effect.

on:
  schedule:
    - cron: '23 2 * * 1-5'    # 07:53 IST
    - cron: '53 2 * * 1-5'    # 08:23 IST
    - cron: '23 3 * * 1-5'    # 08:53 IST
  workflow_dispatch:        # lets you run it by hand to test
    inputs:
      date:
        description: 'today | tomorrow | +N | YYYY-MM-DD (blank = today)'
        required: false
        default: 'today'
      dry_run:
        description: 'Print the message instead of sending (1 = yes)'
        required: false
        default: '0'
      diagnose:
        description: 'Check token and list visible chat ids (1 = yes)'
        required: false
        default: '0'
      force:
        description: 'Send even on an NSE holiday / weekend (1 = yes)'
        required: false
        default: '0'

# Two slots that happen to run together must not both send.
concurrency:
  group: daily-prediction
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write      # to commit the forecast and the sent-marker
    steps:
      - uses: actions/checkout@v7

      # Scheduled runs only: stop if an earlier slot already sent today's
      # message. Manual runs always go through.
      - name: Already sent today?
        id: marker
        run: |
          today=$(TZ=Asia/Kolkata date +%F)
          echo "today=$today" >> "$GITHUB_OUTPUT"
          last=$(cat backend/app/last_push.txt 2>/dev/null || true)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$last" = "$today" ]; then
            echo "already sent for $today — nothing to do"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          else
            echo "skip=0" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v7
        if: steps.marker.outputs.skip == '0'
        with:
          python-version: '3.11'      # pyswisseph builds cleanly here

      - name: Install dependencies
        if: steps.marker.outputs.skip == '0'
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install pyswisseph

      # The bot runs on a free host whose outbound access is restricted to
      # an allowlist that excludes every quote provider, so it cannot fetch
      # prices itself. This runner can, so it publishes the finished
      # forecast (read back by the bot's /vol) — the morning message
      # itself no longer shows it. Never fails the job.
      - name: Publish volatility forecast for the bot
        if: steps.marker.outputs.skip == '0'
        continue-on-error: true
        working-directory: backend
        run: python scripts/publish_forecast.py

      - name: Send prediction
        if: steps.marker.outputs.skip == '0'
        working-directory: backend
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ASTRO_DATE: ${{ github.event.inputs.date }}
          ASTRO_DRY_RUN: ${{ github.event.inputs.dry_run }}
          ASTRO_DIAGNOSE: ${{ github.event.inputs.diagnose }}
          ASTRO_FORCE: ${{ github.event.inputs.force }}
        run: python scripts/daily_push.py

      # Only a real scheduled send stamps the marker (a dry run or a
      # manual test must not block the morning message). The forecast
      # rides along in the same commit.
      - name: Record the send
        if: steps.marker.outputs.skip == '0' && github.event_name == 'schedule'
        run: |
          echo "${{ steps.marker.outputs.today }}" > backend/app/last_push.txt
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/last_push.txt backend/app/volforecast.json
          git commit -m "Daily push ${{ steps.marker.outputs.today }}"
          git pull --rebase
          git push
